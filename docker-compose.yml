version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: preauth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: preauth_desk
      POSTGRES_USER: preauth_user
      POSTGRES_PASSWORD: preauth_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preauth_user -d preauth_desk"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: preauth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: preauth-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://preauth_user:preauth_password@db:5432/preauth_desk
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: stub
      APP_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  agent-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: preauth-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://preauth_user:preauth_password@db:5432/preauth_desk
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: stub
      APP_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: preauth-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    container_name: preauth-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: preauth-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  db_data:
  redis_data:
